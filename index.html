  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));

h1,h2,h3{font-family:var(--display);margin:0;line-height:1.12;text-wrap:balance}
h1{font-size:1.5rem;font-weight:900} h2{font-size:1.1rem;font-weight:700} h3{font-size:.98rem;font-weight:700}
.kicker{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--yellow)}
.muted{color:var(--muted)} p{margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border-radius:12px;padding:11px 16px;cursor:pointer;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);touch-action:manipulation;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;max-width:100%}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.btn-y{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.btn-b{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-ghost{background:transparent}
.btn-s{padding:7px 11px;font-size:.85rem;border-radius:10px}
.btn-wide{width:100%}
input[type=text],input[type=password],input[type=datetime-local],select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--well);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;min-width:0}
textarea{min-height:120px;resize:vertical;font-size:.92rem;line-height:1.45}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.9rem}
.hint{font-size:.84rem;color:var(--muted)}

.status.ok{color:var(--good)} .status.err{color:var(--no)}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:14px;padding:16px;text-align:center}
.seg{display:flex;background:var(--well);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.seg button{font:inherit;font-weight:700;font-size:.86rem;flex:1;white-space:nowrap;padding:8px 12px;border:0;border-radius:9px;background:none;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg)}

/* home */
.hero{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22132%22%20height%3D%22132%22%20viewBox%3D%220%200%20132%20132%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%221.6%22%20opacity%3D%22.13%22%3E%3Ctext%20x%3D%2210%22%20y%3D%2244%22%20font-family%3D%22Arial%20Black%2CArial%22%20font-weight%3D%22900%22%20font-size%3D%2234%22%20transform%3D%22rotate%28-12%2030%2030%29%22%3E21%3C/text%3E%3Cg%20transform%3D%22translate%2896%2084%29%20rotate%2814%29%20scale%28.75%29%22%3E%3Cpath%20d%3D%22M0%2C-28%20C17%2C-28%2022%2C-10%2017%2C2%20C13%2C12%206%2C18%200%2C20%20C-6%2C18%20-13%2C12%20-17%2C2%20C-22%2C-10%20-17%2C-28%200%2C-28%20Z%20M-4%2C25%20L0%2C20%20L4%2C25%20Z%20M0%2C25%20C-6%2C32%206%2C38%200%2C46%22/%3E%3C/g%3E%3Cpath%20d%3D%22M100%2020l3%206%206%203-6%203-3%206-3-6-6-3%206-3z%22%20fill%3D%22%23fff%22%20stroke%3D%22none%22/%3E%3Ccircle%20cx%3D%2230%22%20cy%3D%22104%22%20r%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22none%22/%3E%3C/g%3E%3C/svg%3E") 0 0/132px 132px,radial-gradient(120% 90% at 50% 0%,#3D7BFF,#1E3FA6 55%,#14286E);border-radius:22px;padding:22px 16px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;position:relative;overflow:hidden;box-shadow:none}
.hero h1{font-size:1.6rem;max-width:none}
.hero .kicker{color:#FFE14D;text-wrap:balance}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;margin-top:6px}
.cd div{background:#0B0C10cc;border-radius:14px;padding:12px 2px 9px;box-shadow:inset 0 0 0 1px #ffffff14}
.cd b{display:block;font-family:var(--display);font-weight:800;font-size:1.65rem;line-height:1.05;color:var(--yellow);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cd span{display:block;margin-top:4px;font-size:.75rem;color:#C9D2E6;font-weight:700}
.cd .done{grid-column:1/-1}
.hero .btn{margin-top:6px}
.now{display:flex;gap:12px;align-items:flex-start}
.now .t{font-family:var(--display);font-weight:700;color:var(--yellow);min-width:52px;font-variant-numeric:tabular-nums}
.info{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px 12px;margin:0;font-size:.94rem}
.info dt{color:var(--muted);font-weight:700}
.info dd{margin:0;overflow-wrap:anywhere}


/* calmer home */
.next{font:inherit;color:var(--fg);text-align:left;display:grid;grid-template-columns:auto 52px minmax(0,1fr) auto;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 4px 14px;cursor:pointer;width:100%}
.next .lk{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--yellow);writing-mode:vertical-rl;transform:rotate(180deg);display:none}
.next .nt{font-family:var(--display);font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums}
.next .nx{display:flex;flex-direction:column;min-width:0}
.next .nx b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next .nx small{color:var(--muted);font-size:.84rem}
.next .chev{color:var(--muted);font-size:1.5rem;line-height:1}
.next{grid-template-columns:52px minmax(0,1fr) auto}
.group{display:flex;flex-direction:column;gap:8px}
.gh{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--body);font-weight:700;padding:0 4px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lrow{display:grid;grid-template-columns:92px minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);font-size:.94rem}
.lrow:first-child{border-top:0}
.lk{color:var(--muted);font-weight:700}
.lv{overflow-wrap:anywhere}
.route{font-weight:700;font-size:.84rem;color:var(--ink);background:var(--yellow);border-radius:999px;padding:5px 12px;text-decoration:none}
.route:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.krow{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);font-size:.94rem;line-height:1.45}
.krow:first-child{border-top:0}
.ki{font-size:1.1rem;line-height:1.3;flex:none}
.login{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:24px;text-align:center}
.login .card{width:100%;text-align:left}
.login-mark{border-radius:22px;box-shadow:0 0 0 1px #2A3045,0 16px 40px -12px #FFE14D55}
.sheet .in>*{flex-shrink:0}
.acc [data-st]:empty{display:none}
.acclist{display:flex;flex-direction:column;gap:10px}
.acc{background:var(--well);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.acc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.acc-c{font-size:.88rem;color:var(--muted)}
.acc-c code{font-family:ui-monospace,Menlo,monospace;color:var(--fg);background:var(--panel-2);padding:2px 7px;border-radius:6px;font-size:.95rem;letter-spacing:.08em}
.acc-b{display:flex;flex-wrap:wrap;gap:6px}
.btn-del{color:var(--no);border-color:color-mix(in srgb,var(--no) 50%,transparent)}
.stat{font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid}
.stat.ok{color:var(--good);border-color:var(--good)} .stat.lock{color:var(--maybe);border-color:var(--maybe)} .stat.block{color:var(--no);border-color:var(--no)}
.accform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.accform{grid-template-columns:1fr}}
.codefield{display:flex;gap:6px}
.codefield input{flex:1;min-width:0;font-family:ui-monospace,Menlo,monospace;letter-spacing:.08em}
.mini-note{font-size:.78rem;color:var(--muted);text-align:center}

/* program */
.day{display:flex;flex-direction:column;gap:2px}
.item{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .t{font-family:var(--display);font-weight:700;font-size:.9rem;color:var(--cyan);font-variant-numeric:tabular-nums;padding-top:2px}
.item.past{opacity:.45}
.item.live .t{color:var(--yellow)}
.item.live b::after{content:"NU";margin-left:8px;font-size:.66rem;background:var(--yellow);color:var(--ink);padding:2px 6px;border-radius:999px;vertical-align:2px}

/* rooms */
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:380px){.rooms{grid-template-columns:1fr}}
.room{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.room.me{border-color:var(--yellow);box-shadow:0 0 0 1px var(--yellow)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.84rem;border-radius:999px;padding:4px 11px;background:var(--panel-2);border:1px solid var(--line)}
.chip.me{background:var(--yellow);color:var(--ink);border-color:var(--yellow);font-weight:700}

/* groceries */
.add{display:flex;gap:8px}
.add input{flex:1}
.glist{display:flex;flex-direction:column}
.gi{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line)}
.gi:first-child{border-top:0}
.gi input{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--well);flex:none;cursor:pointer;display:grid;place-items:center;margin:0}
.gi input:checked{background:var(--good);border-color:var(--good)}
.gi input:checked::after{content:"✓";color:var(--ink);font-weight:900;font-size:15px}
.gi .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.gi.done .tx{text-decoration:line-through;color:var(--muted)}
.gi .by{font-size:.75rem;color:var(--muted)}
.gi .x{background:none;border:0;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:4px 8px;line-height:1}
.diet{background:color-mix(in srgb,var(--no) 10%,transparent);border:1px solid color-mix(in srgb,var(--no) 45%,transparent);border-radius:14px;padding:12px 14px;font-size:.9rem}
.diet b{color:var(--no)}

/* games */
.gamegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gametile{font:inherit;text-align:left;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:118px}
.gametile b{font-family:var(--display);font-size:1rem}
.gametile span{font-size:.85rem;color:var(--muted)}
.gametile i{font-style:normal;font-size:1.6rem}
.gametile:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.back{font:inherit;background:none;border:0;color:var(--muted);font-weight:700;cursor:pointer;padding:4px 0;align-self:flex-start}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{font:inherit;aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:clamp(.56rem,2.4vw,.74rem);line-height:1.2;padding:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;word-break:break-word;hyphens:auto}
.cell.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.cell.free{background:var(--yellow);border-color:var(--yellow);color:var(--ink);font-family:var(--display);font-weight:900;font-size:1.2rem;cursor:default}
.cell.win{box-shadow:0 0 0 2px var(--yellow) inset}
.lb{display:flex;flex-direction:column;gap:6px}
.lb div{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;padding:6px 0;border-top:1px solid var(--line)}
.lb div:first-child{border-top:0}
.lb .tag{font-size:.72rem;font-weight:700;background:var(--yellow);color:var(--ink);padding:2px 8px;border-radius:999px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--well);color:var(--fg);cursor:pointer}
.opt.right{background:color-mix(in srgb,var(--good) 22%,var(--well));border-color:var(--good)}
.opt.wrong{background:color-mix(in srgb,var(--no) 22%,var(--well));border-color:var(--no)}
.prompt{font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1.25;min-height:5.5em;display:flex;align-items:center;text-wrap:balance}
.role{font-family:var(--display);font-weight:900;font-size:1.8rem;text-align:center;padding:28px 10px;border-radius:16px;background:var(--well);border:1px solid var(--line)}
.progress{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#2B6BFF,var(--cyan))}

/* sheets */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{width:100%;max-width:640px;max-height:92dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.names{display:flex;flex-wrap:wrap;gap:8px}
.names button{font:inherit;font-weight:700;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--well);color:var(--fg);cursor:pointer}
.names button[aria-pressed="true"]{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.banner{font-size:.84rem;background:color-mix(in srgb,var(--maybe) 14%,transparent);border:1px solid color-mix(in srgb,var(--maybe) 50%,transparent);border-radius:12px;padding:10px 12px}
/* Spark branding */
#splash{position:fixed;inset:0;z-index:100;background:#07080B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .mark{border-radius:26px;box-shadow:0 0 0 1px #2A3045,0 18px 50px -12px #FFE14D55}
#splash .wm span{color:var(--yellow)}
#splash .madeby{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;font-size:.74rem;color:var(--muted);letter-spacing:.06em}
#splash .madeby svg{width:12px;height:12px}
#splash .wm{font-family:var(--display);font-weight:900;font-size:1.7rem;letter-spacing:.02em}
.spark-foot{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.78rem;color:var(--muted);letter-spacing:.04em;padding-top:4px}
.spark-foot svg{width:14px;height:14px}
.footrow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding-top:4px}
.footrow .spark-foot{padding-top:0}
.footrow .sep{color:var(--line)}
.footrow #admin{color:var(--muted);border-color:transparent;padding:6px 8px}
@media (prefers-reduced-motion:no-preference){#splash .mark{animation:zap .9s ease-out both}@keyframes zap{0%{transform:scale(.6) rotate(-8deg);opacity:0}60%{transform:scale(1.06) rotate(2deg);opacity:1}100%{transform:none}}}
@media (prefers-reduced-motion:no-preference){.btn,.cell,.opt,.gametile{transition:background .15s,border-color .15s,transform .1s}.btn:active,.cell:active,.opt:active{transform:scale(.97)}}
/* ===================== THEMA v3: strak donker, één accentkleur ===================== */
:root{--bg:#0E0E10;--panel:#1A1A1D;--panel-2:#242428;--well:#141416;--line:#29292E;--fg:#F5F5F7;--muted:#8E8E96;
  --card:#1A1A1D;--edge:transparent;--display:"Plus Jakarta Sans","Segoe UI",Roboto,sans-serif;--body:"Plus Jakarta Sans","Segoe UI",Roboto,sans-serif;
  --tabh:66px;--spring:cubic-bezier(.3,1.35,.5,1);--ease:cubic-bezier(.2,.8,.2,1);--r:22px;--good:#FFE14D}
html,body{background:var(--bg)}
body{background:var(--bg)}
#pat{display:none}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em}
h1{font-weight:700} h2{font-weight:700} h3{font-weight:700}
.kicker{color:var(--muted);letter-spacing:.02em;text-transform:none;font-size:.82rem;font-weight:600}
.card,.list{background:var(--card);border:0;border-radius:var(--r);box-shadow:none}
.btn{border-radius:999px;border:0;background:var(--panel-2);font-weight:700;position:relative;overflow:hidden}
.btn-y{background:var(--yellow);color:var(--ink)}
.btn-ghost{background:transparent}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.16;transform:scale(0);pointer-events:none;animation:rip .55s var(--ease) forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
input[type=text],input[type=password],input[type=datetime-local],select,textarea{background:var(--panel);border:1px solid transparent;border-radius:16px;padding:14px 16px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--yellow)}
.empty{border-color:var(--line);border-radius:var(--r)}
.seg{background:var(--panel);border:0;border-radius:999px;padding:4px}
.seg button{border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
/* header */
header.top{background:color-mix(in srgb,var(--bg) 88%,transparent);border-bottom:0;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:12px}
.me{font:inherit;color:var(--fg);background:none;border:0;padding:0;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;min-width:0}
.me span{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.me small{color:var(--muted);font-size:.8rem;font-weight:500}
.me b{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{--s:30px;--c:#3D7BFF;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-grid;place-items:center;font-weight:800;font-size:calc(var(--s)*.4);color:#0E0E10;background:var(--c)}

.t-id{font-size:.62rem;letter-spacing:.12em;opacity:.7}
.t-code{width:36px;height:70px;background:repeating-linear-gradient(0deg,#0E0E10 0 2px,transparent 2px 4px,#0E0E10 4px 7px,transparent 7px 9px)}
.inv-go{padding:17px;font-size:1.05rem;margin-top:4px}
.inv-sub{text-align:center;font-size:.82rem;color:var(--muted);margin-top:-6px}

.note-row{display:flex;gap:10px;font-size:.92rem;padding:12px 14px;border-radius:16px;background:var(--card)}
.mini-note{color:var(--muted)}
.footrow #admin{color:var(--muted)}
/* programma */
.days{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.daybox{font:inherit;color:var(--muted);background:var(--card);border:1.5px solid transparent;border-radius:18px;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.daybox i{display:flex;gap:3px;height:8px;align-items:center}.daybox i::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6}
.daybox small{font-size:.86rem;font-weight:600}
.daybox b{font-size:1.15rem;color:var(--fg)}
.daybox[aria-pressed="true"]{border-color:var(--yellow);color:var(--yellow)}
.daybox[aria-pressed="true"] i::before{background:var(--yellow);opacity:1}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tl-i{display:flex;gap:14px;align-items:center;padding:14px;border-radius:var(--r);background:var(--card)}
.tl-i .t{flex:none;width:58px;height:58px;border-radius:16px;background:var(--panel-2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:.98rem;font-variant-numeric:tabular-nums}
.tl-i .t small{font-size:.66rem;color:var(--muted);font-weight:600}
.tl-c{min-width:0}
.tl-c b{display:block;font-size:1rem}
.tl-c p{font-size:.86rem;color:var(--muted)}
.tl-i.past{opacity:.4}
.tl-i.live{box-shadow:inset 0 0 0 1.5px var(--yellow)}
.tl-i.live .t{background:var(--yellow);color:var(--ink)}.tl-i.live .t small{color:#0E0E10aa}
.tl-i.live b::after{content:"NU";margin-left:8px;font-size:.62rem;background:var(--yellow);color:var(--ink);padding:2px 7px;border-radius:999px;vertical-align:2px}
/* kamers */
.myroom{position:relative;overflow:hidden;border-radius:26px;padding:20px;color:var(--ink);background:var(--yellow)}
.myroom .kicker{color:#0E0E10aa}
.myroom h2{font-size:1.7rem;margin:2px 0 16px}
.myroom::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:#ffffff40}
.avs{display:flex;flex-wrap:wrap;gap:16px;position:relative;z-index:1}
.avn{display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:700;font-size:.84rem}
.avn .av{box-shadow:0 0 0 3px var(--ink)}
.rooms{gap:10px}
.room{background:var(--card);border:0;border-radius:var(--r);padding:16px}
.room.me{box-shadow:none}
.room-h{display:flex;align-items:center;gap:8px}
.room-h h3{flex:1;font-size:1rem}
.room-h .cnt{font-size:.75rem;font-weight:700;color:var(--muted);background:var(--panel-2);border-radius:999px;padding:3px 10px}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.pp{display:flex;align-items:center;gap:9px;font-size:.92rem;font-weight:600}
.bigempty{text-align:center;padding:30px 12px;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--card);border-radius:var(--r)}
.bigempty i{font-style:normal;font-size:2.4rem}
@media (prefers-reduced-motion:no-preference){.bigempty i{animation:bob 2.6s ease-in-out infinite}}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
/* boodschappen */
.shophead{display:flex;align-items:center;gap:16px;padding:16px;border-radius:var(--r);background:var(--card)}
.ring{--p:0;width:60px;height:60px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--yellow) calc(var(--p)*1%),#ffffff14 0)}
.ring::before{content:"";grid-area:1/1;width:48px;height:48px;border-radius:50%;background:var(--card)}
.ring b{grid-area:1/1;position:relative;font-size:.82rem;font-weight:800}
.add{display:flex;gap:8px;background:var(--card);border:1.5px solid transparent;border-radius:999px;padding:5px 5px 5px 18px;align-items:center}
.add input{background:none!important;border:0!important;padding:9px 0!important;flex:1}
.add:focus-within{border-color:var(--yellow)}
.add .btn{width:44px;height:44px;padding:0;border-radius:50%;font-size:1.4rem}
.glist{display:flex;flex-direction:column;gap:8px}
.gi{display:flex;align-items:center;gap:12px;border:0;border-radius:18px;background:var(--card);padding:12px 8px 12px 14px}
.gi:first-child{border-top:0}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid #ffffff30;background:transparent;flex:none;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--ink)}
.chk svg{width:15px;height:15px;stroke:currentColor;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s .05s}
.gi.done .chk{background:var(--yellow);border-color:var(--yellow)}
.gi.done .chk svg{stroke-dashoffset:0}
.gi.done .tx{text-decoration:line-through;color:var(--muted)}
.gi .tx{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.gi .by{display:inline-flex;align-items:center;gap:5px;margin-left:6px;vertical-align:1px;font-size:.78rem;color:var(--muted);font-weight:500;text-decoration:none}
.gi .by .av{--s:18px}
.gi .x{background:none;border:0;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:4px 8px;line-height:1}
.gi.pop .chk{animation:popk .45s var(--spring)}
@keyframes popk{40%{transform:scale(1.3)}}
.gi.new{animation:rise .45s var(--spring)}
.gi.out{animation:out .25s ease forwards}
@keyframes out{to{opacity:0;transform:translateX(40px) scale(.95)}}
.diet{border-radius:18px}
/* spellen */
.gamegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gametile{--g1:#FFE14D;font:inherit;position:relative;overflow:hidden;border:0;color:var(--fg);min-height:150px;border-radius:var(--r);padding:16px;background:var(--card);display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;box-shadow:none}
.gametile i{font-style:normal;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:1.45rem;background:color-mix(in srgb,var(--g1) 18%,transparent);margin-bottom:12px}
.gametile b{font-size:1rem;font-family:var(--display)}
.gametile span{font-size:.84rem;color:var(--muted)}
.gametile.feat{background:var(--yellow);color:var(--ink);grid-column:1/-1;min-height:130px}
.gametile.feat i{background:#0E0E1014;position:absolute;right:16px;top:16px;width:64px;height:64px;font-size:2rem}
.gametile.feat span{color:#0E0E10aa}
.back{font:inherit;display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:0;border-radius:999px;padding:8px 16px 8px 12px;color:var(--fg);font-weight:700;cursor:pointer;align-self:flex-start}
.cell{border:0;border-radius:14px;background:var(--card)}
.cell.on{background:var(--yellow);color:var(--ink)}
.cell.free{background:var(--panel-2);color:var(--yellow)}
.cell.win{box-shadow:inset 0 0 0 2px var(--fg)}
.cell.pop{animation:popk .45s var(--spring)}
.bprog{display:flex;align-items:center;gap:10px;font-weight:700;font-size:.9rem}
.bprog .progress{flex:1}
.progress{background:var(--panel-2)}.progress i{background:var(--yellow)}
.lb .tag{background:var(--yellow)}
.opt{display:flex;align-items:center;gap:12px;border:0;border-radius:18px;background:var(--panel-2);padding:14px;position:relative;overflow:hidden}
.opt .L{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:#ffffff12;flex:none}
.opt.right{background:#FFE14D24;box-shadow:inset 0 0 0 1.5px var(--yellow)}.opt.right .L{background:var(--yellow);color:var(--ink)}
.opt.wrong{background:#FF7A6E1f;box-shadow:inset 0 0 0 1.5px var(--no)}.opt.wrong .L{background:var(--no);color:var(--ink)}
.opt.wrong{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.score{font-size:3.4rem;font-weight:800;line-height:1;color:var(--yellow)}
.qhero{border-radius:26px;padding:20px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.deck{position:relative;padding:6px 0 14px}
.deck::before{content:"";position:absolute;left:16px;right:16px;top:16px;bottom:0;border-radius:26px;background:#141416;z-index:0}
.pcard{position:relative;z-index:1;min-height:260px;border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:12px;background:var(--panel-2);touch-action:pan-y;cursor:grab;will-change:transform}
.pcard .prompt{flex:1;min-height:0;font-size:1.45rem;font-family:var(--display);font-weight:700}
.pcard .swipe{font-size:.78rem;color:var(--muted);text-align:center}
.pcard.deal{animation:deal .45s var(--spring)}
@keyframes deal{from{transform:translateY(30px) scale(.92) rotate(2deg);opacity:0}}
.pcard.fly{transition:transform .3s ease-in,opacity .3s;transform:translateX(-130%) rotate(-18deg)!important;opacity:0}
.flipc{perspective:900px;height:220px}
.flipc .fi{position:relative;width:100%;height:100%;transition:transform .6s var(--spring);transform-style:preserve-3d}
.flipc.on .fi{transform:rotateY(180deg)}
.flipc .ff,.flipc .fb{position:absolute;inset:0;border-radius:26px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-weight:800}
.flipc .ff{background:var(--card);font-size:3rem;color:var(--muted)}
.flipc .fb{transform:rotateY(180deg);background:var(--yellow);color:var(--ink);font-size:1.8rem}
.flipc .fb i{font-style:normal;font-size:3rem}
/* sheet + toast */
.sheet:not([hidden]){animation:fadein .25s ease}
.sheet .in{border:0;background:#1A1A1D;border-radius:28px 28px 0 0;padding-top:28px;position:relative}
.sheet .in::before{content:"";position:absolute;top:10px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:9px;background:#ffffff26}
@media (prefers-reduced-motion:no-preference){.sheet:not([hidden]) .in{animation:sheetup .4s var(--spring)}}
.sheet.closing{background:transparent}.sheet.closing .in{transform:translateY(100%);transition:transform .22s ease-in}
@keyframes sheetup{from{transform:translateY(100%)}}
@keyframes fadein{from{background:transparent}}
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 22px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--ink);font-weight:700;padding:11px 18px;border-radius:999px;max-width:90vw;text-align:center;transform:translate(-50%,24px) scale(.9);opacity:0;transition:transform .35s var(--spring),opacity .25s;pointer-events:none}
#toast.show{transform:translate(-50%,0) scale(1);opacity:1}
.cf{position:fixed;z-index:200;pointer-events:none}
/* login */
.login{padding-top:30px}
.login h1{font-size:1.6rem}
.login .card{background:none;padding:0;gap:14px}
.login .btn-y{padding:15px}
.login-mark{border-radius:24px;box-shadow:none}
@media (prefers-reduced-motion:no-preference){.login-mark{animation:bob 3s ease-in-out infinite}}
#splash{background:var(--bg)}
#splash .tag21{color:var(--muted);font-size:.9rem;margin-top:-6px}
#splash .mark{box-shadow:none}
#splash .wm{font-family:var(--display);font-weight:800}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>

(function(){
"use strict";
const CFG=window.W21_CONFIG||{};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
/* formulieren zelf afhandelen: werkt ook in previews waar echte formulier-verzending geblokkeerd is */
function fireSubmit(f){f.dispatchEvent(new Event("submit",{cancelable:true}));}
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest('button[type="submit"]');if(!b||!b.form)return;e.preventDefault();if(!b.disabled)fireSubmit(b.form);});
document.addEventListener("keydown",e=>{if(e.key!=="Enter"||e.defaultPrevented||e.isComposing)return;const t=e.target;if(t.tagName!=="INPUT"||!t.form)return;e.preventDefault();fireSubmit(t.form);});

/* ================= standaard inhoud ================= */
const DEFAULTS={settings:{title:"Weekendje weg",weekendNote:"9–11 of 16–18 april",fixed:false,fixedLabel:"",start:"2027-04-09T15:00",end:"2027-04-11T11:00",house:"EuroParcs Beekbergen",address:"Hoge Bergweg 16, 7361 GS Beekbergen",notes:""}};
const lines=t=>String(t||"").split(/\n/).map(s=>s.trim()).filter(Boolean);

/* ================= opslag + accounts ================= */
let LOGINMSG="";
/* rollen: J21-001 = hoofdbeheerder, J21-002 t/m J21-009 = beheerder, de rest = gast */
const OWNER_REF="J21-001";
function roleOf(ref){const r=String(ref||"").trim().toUpperCase();return r===OWNER_REF?2:/^J21-00[2-9]$/.test(r)?1:0;}
const ROLE_NAME=["Gast","Beheerder","Hoofdbeheerder"], ROLE_IC=["🎟️","🛠️","👑"];
const isAdmin=()=>!!(Store.session&&Store.session.role>=1);
const Local={accounts(){const a=lsGet("w21-accounts",null)||[{name:"Thomas",code:"2121",status:"actief",ref:OWNER_REF}];
    if(!a.some(x=>roleOf(x.ref)===2)){const t=a.find(x=>x.name.toLowerCase()==="thomas")||a[0];if(t)t.ref=OWNER_REF;}return a;},
  save(a){lsSet("w21-accounts",a);}};
/* dezelfde regels als in supabase.sql, voor de testmodus */
function accRules(list,me,target,name,code,status,ref){
  const myRole=roleOf(me&&me.ref), tRole=target?roleOf(target.ref):-1, nRole=roleOf(ref), lc=x=>String(x||"").toLowerCase();
  if(myRole<1) return "rights";
  if(!name||!code) return "empty";
  if(list.some(x=>lc(x.name)===lc(name)&&x!==target)) return "exists";
  if(ref&&list.some(x=>x!==target&&String(x.ref||"").toUpperCase()===ref.toUpperCase())) return "refexists";
  if(!target){ if(nRole===2) return "owner"; if(nRole===1&&myRole<2) return "rights"; return ""; }
  if(tRole===2){ if(target!==me) return "owner"; if(nRole!==2||status!=="actief") return "owner"; return ""; }
  if(nRole===2) return "owner";
  if(tRole===1&&target!==me&&myRole<2) return "rights";
  if(nRole!==tRole&&myRole<2) return "rights";
  if(target===me&&status!=="actief") return "self";
  return "";
}
const Acc={
  async list(){
    if(Store.mode==="live"){const r=await Store.rpc("w21_admin_accounts",{p_token:Store.token});return r&&r.ok?r.accounts:[];}
    return Local.accounts();
  },
  async save(old,name,code,status,ref){
    name=String(name||"").trim(); code=String(code||"").trim(); ref=String(ref||"").trim().toUpperCase();
    if(Store.mode==="live"){
      const r=await Store.rpc("w21_admin_save_account",{p_token:Store.token,p_old_name:old||null,p_name:name,p_code:code,p_status:status||"actief",p_ref:ref});
      if(r.ok){Store.ping();await Store.pull();} return r.ok?"":r.reason;
    }
    const a=Local.accounts(), me=a.find(x=>x.token&&x.token===Store.token), x=old?a.find(y=>y.name.toLowerCase()===old.toLowerCase()):null;
    if(old&&!x) return "missing";
    const err=accRules(a,me,x,name,code,status||"actief",ref); if(err) return err;
    if(!x) a.push({name,code,status:status||"actief",ref});
    else{ if((x.code!==code||x.status!==(status||x.status))&&x!==me) x.token=null; Object.assign(x,{name,code,status:status||x.status,ref}); }
    Local.save(a); Store.people=a.filter(y=>y.status==="actief").map(y=>y.name);
    if(me) Store.session={name:me.name,role:roleOf(me.ref),ref:me.ref};
    Store.emit(); return "";
  },
  async remove(name){
    if(Store.mode==="live"){const r=await Store.rpc("w21_admin_delete_account",{p_token:Store.token,p_name:name});if(r.ok){Store.ping();await Store.pull();}return r.ok?"":r.reason;}
    const all=Local.accounts(), me=all.find(x=>x.token&&x.token===Store.token), t=all.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!t) return "missing"; const tr=roleOf(t.ref), mr=roleOf(me&&me.ref);
    if(mr<1) return "rights"; if(tr===2) return "owner"; if(t===me) return "self"; if(tr===1&&mr<2) return "rights";
    const a=all.filter(x=>x!==t); Local.save(a);
    Store.people=a.filter(x=>x.status==="actief").map(x=>x.name); Store.emit(); return "";
  }
};
const Store={mode:"local",data:{},people:[],subs:[],client:null,chan:null,token:lsGet("w21-token",""),session:null,
  live(){return !!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase);},
  async rpc(fn,args){const {data,error}=await this.client.rpc(fn,args);if(error)throw error;return data;},
  async init(){
    if(this.live()){
      try{
        this.client=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY); this.mode="live";
        this.chan=this.client.channel("w21-sync",{config:{broadcast:{self:false}}}).on("broadcast",{event:"changed"},()=>this.pull()).subscribe();
        setInterval(()=>{if(this.session&&!document.hidden)this.pull();},20000);
        document.addEventListener("visibilitychange",()=>{if(!document.hidden&&this.session)this.pull();});
        if(this.token) await this.pull(true);
      }catch(e){console.warn(e);this.mode="offline";}
      return;
    }
    this.data=lsGet("w21-store",{});
    const accs=Local.accounts(), me=accs.find(a=>a.token&&a.token===this.token&&a.status==="actief");
    if(me) this.session={name:me.name,role:roleOf(me.ref),ref:me.ref||""};
    this.people=accs.filter(a=>a.status==="actief").map(a=>a.name);
  },
  async pull(first){
    if(!this.token) return;
    try{
      const r=await this.rpc("w21_get",{p_token:this.token});
      if(!r||!r.ok){this.logout(first?"":"Je bent uitgelogd. Log opnieuw in met je naam en code.");return;}
      this.session={name:r.name,role:r.role||0,ref:r.ref||""}; this.votes=r.votes||null; this.data=r.data||{}; this.people=r.people||[]; this.emit();
    }catch(e){ if(first) this.mode="offline"; }
  },
  async login(name,code){
    if(this.mode==="live"){
      const r=await this.rpc("w21_login",{p_name:name,p_code:code});
      if(!r.ok) return r.reason;
      this.token=r.token; lsSet("w21-token",r.token); await this.pull(true); return "";
    }
    const accs=Local.accounts(), a=accs.find(x=>x.name.toLowerCase()===name.trim().toLowerCase());
    if(!a||a.code!==code.trim()) return "wrong";
    if(a.status==="op slot") return "locked";
    if(a.status==="geblokkeerd") return "blocked";
    a.token=a.token||uid(); Local.save(accs);
    this.token=a.token; lsSet("w21-token",a.token); this.session={name:a.name,role:roleOf(a.ref),ref:a.ref||""};
    this.people=accs.filter(x=>x.status==="actief").map(x=>x.name); this.emit(); return "";
  },
  logout(msg){this.token="";this.session=null;lsSet("w21-token","");LOGINMSG=msg||"";if(!$("#sheet").hidden)closeSheet();this.emit();},
  get(k,d){return this.data[k]===undefined?d:this.data[k];},
  keys(prefix){return Object.keys(this.data).filter(k=>k.startsWith(prefix));},
  async set(k,v,admin){
    this.data[k]=v; this.emit();
    if(this.mode!=="live"){lsSet("w21-store",this.data);return;}
    try{
      const r=admin?await this.rpc("w21_admin_set",{p_token:this.token,p_key:k,p_value:v}):await this.rpc("w21_set",{p_token:this.token,p_key:k,p_value:v});
      if(!r.ok){ if(r.reason==="auth") this.logout("Je bent uitgelogd. Log opnieuw in met je naam en code."); else {toast("Opslaan niet gelukt.");this.pull();} return; }
      this.ping();
    }catch(e){toast("Opslaan mislukt, check je internet.");}
  },
  async del(k,admin){
    delete this.data[k]; this.emit();
    if(this.mode!=="live"){lsSet("w21-store",this.data);return;}
    try{
      const r=admin?await this.rpc("w21_admin_del",{p_token:this.token,p_key:k}):await this.rpc("w21_del",{p_token:this.token,p_key:k});
      if(!r.ok){ if(r.reason==="auth") this.logout("Je bent uitgelogd. Log opnieuw in met je naam en code."); else {toast("Verwijderen niet gelukt.");this.pull();} return; }
      this.ping();
    }catch(e){toast("Verwijderen mislukt, check je internet.");}
  },
  ping(){try{this.chan&&this.chan.send({type:"broadcast",event:"changed",payload:{}});}catch(e){}},
  on(f){this.subs.push(f);},
  emit(){clearTimeout(this._t);this._t=setTimeout(()=>this.subs.forEach(f=>f()),40);}
};
const settings=()=>Object.assign({},DEFAULTS.settings,Store.get("settings",{}));
const text=k=>Store.get("txt:"+k,DEFAULTS[k]);


/* ================= helpers ================= */
let ME="";
function toast(m){let s=$("#toast");if(!s){s=document.createElement("div");s.id="toast";s.setAttribute("role","status");document.body.appendChild(s);}
  s.textContent=m;s.classList.remove("show");void s.offsetWidth;s.classList.add("show");clearTimeout(s._t);s._t=setTimeout(()=>s.classList.remove("show"),2400);}
const PAL=["#3D7BFF","#FFE14D","#5FE3FF","#FF7A6E","#5FE3A1","#B78CFF","#FF9F45","#FF6FB5"];
function hue(n){let h=7;for(const c of String(n).toLowerCase())h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length];}
function avatar(n,size){return `<span class="av" style="--c:${hue(n)}${size?`;--s:${size}px`:""}" aria-hidden="true">${esc(String(n||"?").trim().charAt(0).toUpperCase())}</span>`;}
const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function buzz(ms){try{if(lsGet("w21-vib",true)!==false&&navigator.vibrate)navigator.vibrate(ms||8);}catch(e){}}
function confetti(x,y,n){
  if(RM||!document.body.animate)return; x=x==null?innerWidth/2:x; y=y==null?innerHeight/3:y; n=n||80;
  const cols=["#FFE14D","#3D7BFF","#5FE3FF","#FFFFFF","#FF7A6E","#5FE3A1"];
  for(let i=0;i<n;i++){const d=document.createElement("i");d.className="cf";const s=5+Math.random()*7;
    d.style.cssText=`left:${x}px;top:${y}px;width:${s}px;height:${s*(.45+Math.random()*.8)}px;background:${cols[i%cols.length]};border-radius:${Math.random()<.3?"50%":"2px"}`;
    document.body.appendChild(d);
    const a=Math.random()*Math.PI*2,v=80+Math.random()*240,dx=Math.cos(a)*v,up=-(120+Math.random()*260),fall=380+Math.random()*320,r=Math.random()*1000-500;
    d.animate([{transform:"translate(-50%,-50%) rotate(0)",opacity:1},
      {transform:`translate(calc(-50% + ${dx*.7}px),calc(-50% + ${up}px)) rotate(${r*.4}deg)`,opacity:1,offset:.35},
      {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${up+fall}px)) rotate(${r}deg)`,opacity:0}],
      {duration:1500+Math.random()*900,easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish=()=>d.remove();}
}
function head(title,sub){return `<header class="ph"><h1>${title}</h1>${sub?`<p>${sub}</p>`:""}</header>`;}

/* ================= datum: stemmen of vast ================= */
const MONTHS={jan:0,feb:1,maa:2,mrt:2,apr:3,mei:4,jun:5,jul:6,aug:7,sep:8,okt:9,nov:10,dec:11};
function allWeekendOptions(){const d=(String(settings().weekendNote||"").match(/\d+\s*[–-]\s*\d+(?:\s+(?:jan\w*|feb\w*|maart|mrt|apr\w*|mei|jun\w*|jul\w*|aug\w*|sep\w*|okt\w*|nov\w*|dec\w*))?/gi)||[]).map(x=>x.trim().replace(/\s*-\s*/,"–"));
  const last=(d.map(x=>(x.match(/[a-z]+/i)||[])[0]).filter(Boolean).pop())||"april";
  const out=d.map(x=>/[a-z]/i.test(x)?x:x+" "+last); return out.length?out:["9–11 april","16–18 april"];}
function weekendOptions(){const s=settings();return s.fixed&&s.fixedLabel?[s.fixedLabel]:allWeekendOptions();}
function weekendDates(label){
  const m=String(label).match(/(\d+)\s*[–-]\s*(\d+)\s*([a-z]+)?/i); if(!m) return null;
  const mon=MONTHS[String(m[3]||"april").slice(0,3).toLowerCase()]??3, cur=new Date(settings().start);
  let y=!isNaN(cur)?cur.getFullYear():new Date().getFullYear(); if(new Date(y,mon,+m[1])<new Date()) y++;
  const a=new Date(y,mon,+m[1],15,0), b=new Date(y,+m[2]<+m[1]?mon+1:mon,+m[2],11,0), z=n=>String(n).padStart(2,"0");
  const fmt=d=>`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`;
  return {start:fmt(a),end:fmt(b)};
}
function voteCounts(){
  if(Store.mode==="live"&&Store.votes) return Store.votes;
  const out={}; Store.keys("a:").forEach(k=>{const a=Store.get(k);Object.entries((a&&a.wk)||{}).forEach(([w,v])=>{const o=out[w]=out[w]||{kan:0,misschien:0,niet:0,total:0};if(o[v]!=null)o[v]++;o.total++;});});
  return out;
}
function voteHero(s){
  const opts=allWeekendOptions(), V=voteCounts(), score=w=>((V[w]||{}).kan||0)*2+((V[w]||{}).misschien||0);
  const top=opts.slice().sort((a,b)=>score(b)-score(a))[0], anyVotes=opts.some(w=>score(w)>0), voted=Math.max(0,...opts.map(w=>(V[w]||{}).total||0));
  const max=Math.max(1,...opts.map(w=>((V[w]||{}).kan||0)+((V[w]||{}).misschien||0)));
  return `<section class="hero2 vote" id="hero">
    <div><span class="kicker">Datum nog niet bekend</span><h1>Welk weekend wordt het? 🗳️</h1></div>
    <div class="vopts">${opts.map(w=>{const c=V[w]||{kan:0,misschien:0,niet:0};const lead=anyVotes&&w===top&&score(w)>score(opts.find(x=>x!==w)||"");
      return `<div class="vopt ${lead?"lead":""}">${lead?'<span class="vlead">Voorloper</span>':""}<b>${esc(w)}</b><span class="vnum">${c.kan}<small>${c.kan===1?"kan":"kunnen"}</small></span>
        <span class="vbar"><i class="k" style="width:${c.kan/max*100}%"></i><i class="m" style="width:${c.misschien/max*100}%"></i></span>
        <small class="vsub">${c.misschien?`+${c.misschien} misschien`:"&nbsp;"}</small></div>`;}).join("")}</div>
    <p class="vfoot">${voted?`${voted} ${voted===1?"persoon heeft":"mensen hebben"} gestemd`:"Nog niemand gestemd"} · Thomas kiest zodra iedereen heeft gestemd</p>
    <button type="button" class="btn btn-y btn-wide" data-go="answers">Mijn keuze aanpassen</button>
  </section>`;
}

function wireList(key,arr,opts){opts=opts||{};

  $("#accnew").querySelectorAll("[data-kind]").forEach(b=>b.addEventListener("click",()=>{const r=nextRef(ED._list||[],b.dataset.kind==="1");if(!r){toast("Alle beheerplekken (002 t/m 009) zijn bezet");return;}$("#nr").value=r;showRole();buzz(5);}));
  $("#ngen").addEventListener("click",()=>{$("#nc").value=newCode();buzz(5);});
  $("#accnew").addEventListener("submit",async e=>{
    e.preventDefault(); const st=$("#nst"), n=$("#nn").value.trim(), c=$("#nc").value.trim(), ref=$("#nr").value.trim();
    const r=await Acc.save(null,n,c,"actief",ref);
    if(r){st.textContent=ACC_ERR[r]||"Toevoegen lukte niet.";st.className="status err";return;}
    st.textContent=`${n} is toegevoegd${ref?" als "+ref:""} met code ${c}.`;st.className="status ok"; buzz(15);
    ED.open=n; $("#nn").value=""; $("#nc").value=newCode(); $("#nr").value=""; await drawAccounts(); showRole();
  });
  drawAccounts().then(showRole);
}


/* ================= start ================= */
(async function start(){
  $("#view").innerHTML='<p class="muted" style="text-align:center;padding:40px 0">Laden…</p>';
  await Store.init(); render();
})();
})();
</script>
